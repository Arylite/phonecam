name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow reuses these jobs to build what it publishes.
  workflow_call:
    inputs:
      version:
        description: Version to stamp into both builds (1.2.3)
        type: string
        required: true

# A newer push makes the run of the previous one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '0.0.0' }}

jobs:
  ascii:
    name: ASCII only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # gradlew is generated by Gradle and kept as shipped.
      - name: Reject non-ASCII characters
        run: |
          if git grep -nIP '[^\x00-\x7F]' -- . ':!android/gradlew'; then
            echo "::error::Non-ASCII characters found (see above)"
            exit 1
          fi

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          # Quoted: PowerShell would split the argument at the first dot.
          cmake -S windows -B windows/build -A x64 "-DPHONECAM_VERSION=${{ env.VERSION }}"
          cmake --build windows/build --config Release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path windows/build/bin/PhoneCam.exe, windows/build/bin/PhoneCamSource.dll, README.md, LICENSE -DestinationPath PhoneCam-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: PhoneCam-windows-x64.zip
          retention-days: 7

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Restores the Gradle user home (wrapper, dependencies, build cache) between runs.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PHONECAM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Lint and build
        env:
          VERSION_NAME: ${{ env.VERSION }}
          VERSION_CODE: ${{ github.run_number }}
          PHONECAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PHONECAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PHONECAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew ktlintCheck lintRelease assembleRelease
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk ../PhoneCam-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: PhoneCam-android.apk
          retention-days: 7
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/
          retention-days: 7

  # The single check to require in branch protection, whatever jobs are added above.
  passed:
    name: CI passed
    if: always()
    needs: [ascii, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
